name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres rather than a mocked repository. Soft-delete exclusion is TypeORM
    # behaviour, so a mock would assert our own stub; a live database also proves the
    # migration applies cleanly in an environment nobody here controls.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_articles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports -d sports_articles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sports:sports@localhost:5432/sports_articles
      TEST_DATABASE_URL: postgres://sports:sports@localhost:5432/sports_articles_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter backend db:migrate

      - name: Seed
        run: pnpm --filter backend seed

      - run: pnpm build

      - run: pnpm test
