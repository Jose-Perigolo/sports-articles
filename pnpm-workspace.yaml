packages:
  - 'apps/*'

# pnpm skips dependency build scripts unless they are allowlisted, and a cold `pnpm install`
# exits non-zero when it finds an unapproved one. pnpm 11 reads `allowBuilds` (a map); pnpm 10
# reads `onlyBuiltDependencies` (a list). Both are declared so either major installs cleanly.
allowBuilds:
  '@apollo/protobufjs': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# Auto-managed by pnpm (release-cooldown exclusions) — do not hand-edit.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - typescript-eslint@8.68.0
