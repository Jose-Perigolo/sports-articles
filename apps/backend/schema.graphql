type SportsArticle {
  id: ID!
  title: String!
  content: String!
  imageUrl: String
  createdAt: String
  deletedAt: String
}

input ArticleInput {
  title: String!
  content: String!
  imageUrl: String
}

type Query {
  """
  Newest first. `limit` defaults to 10 and is capped at 50 regardless of what is requested.
  """
  articles(limit: Int, offset: Int): [SportsArticle!]!
  article(id: ID!): SportsArticle
}

type Mutation {
  createArticle(input: ArticleInput!): SportsArticle!
  updateArticle(id: ID!, input: ArticleInput!): SportsArticle!
  deleteArticle(id: ID!): Boolean!
}
